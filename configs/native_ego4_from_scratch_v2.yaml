version: native-ego-four-corpus-scratch-v1
output: runs/native_ego4_from_scratch_v2
seed: 20261101
selection: configs/scene_data_current.json
scene_paths: configs/scene_paths.local.yaml
amass_index: runs/amass128/index/complete.json
reference_loss_config: configs/amass_ego128.yaml
data:
  datasets: [amass, egobody, trumans, grail]
  excluded_datasets: [rich]
  split_train: train
  split_validation: validation
  frames: 128
  fps: 30
  source_quota_per_update: 32
  sampling: equal_source_quota_with_replacement
  scene: disabled
model:
  latent_dim: 256
  dim_mults: [1, 2, 4]
  initialization: from_scratch
  scene_modules_trainable: false
training:
  effective_batch_size: 128
  microbatch_size: 32
  planned_updates: 14000
  extension_updates: 2000
  checkpoint_every: 128
  quick_validation_every: 1024
  full_validation_steps: [0, 2048, 4096, 6144, 8192, 10240, 12288, 14000]
  throughput_pilot_updates: 256
  precision: fp32
optimizer:
  lr: 0.0001
  weight_decay: 0.01
  clip_norm: 1.0
  warmup_updates: 1000
  lr_floor_fraction: 0.1
validation:
  seed: 777
  ddim_steps: 20
  quick_families_per_dataset: 8
  eval_batch_size: 32
  primary: equal_dataset_family_macro_mpjpe_mm
  tie_tolerance_mm: 0.5
  test_used: false
  exhaustive_final: true
runtime:
  memory_gib: 10
  allocator_gib: 5.5
  cpu_count: 4
