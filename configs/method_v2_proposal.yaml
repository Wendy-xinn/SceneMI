# Review-only specification. No current trainer implements this schema.
schema: method-v2-review-proposal-v2
status:
  implementation: not_implemented
  cpu_acceptance: not_run
  cuda_acceptance: not_run
  launch_allowed: false
  performance_claims: none
  revision: 2026-10-29-user-review-noise-sampling-anchor-fallback
documents:
  method: docs/METHOD_V2_REVIEW_zh.md
  experiments: docs/METHOD_V2_EXPERIMENTS_zh.md
data:
  frames: 128
  fps: 30
  joints: 22
  coordinates: right_handed_y_up_meters
  amass_split: configs/amass_splits.json
  native_selection: configs/scene_data_current.json
  native_selection_check: runs/data_inventory/CURRENT_SELECTION_CHECK.json
  exo_payload_adapter_ready: false
  excluded_datasets:
  - rich
  test_used_for_selection: false
  position_scale_m: 2.0
  shape:
    ego: predicted_from_observations
    exo: decoded_estimated_frontend_shape
    ground_truth_shape_input: false
    query_and_final_fk_share_estimated_shape: true
model:
  diffusion_state_dim: 201
  kinematic_readout_dim: 135
  position_output: derived_by_fk_only
  temporal_unet:
    base_width: 256
    width_multipliers:
    - 1
    - 2
    - 4
    temporal_resolutions:
    - 128
    - 64
    - 32
    normalization: groupnorm_adagn
    shared_encoder: true
    shared_decoder: true
  observation:
    mode_dispatch: explicit_enum
    separate_ego_exo_weights: true
    hidden: 128
    temporal_kernel: 5
    temporal_dilations:
    - 1
    - 2
    - 4
    exo_joint_features: 22
    joint_id_dim: 16
    exo_joint_mlp:
    - 38
    - 64
    - 32
    observer_metadata: optional_exo_condition_not_target_head
    exo_raw_joint_features: 13
    exo_reference_joint_features: 9
  boundary:
    enabled: true
    mode: exo
    retrieval: per_joint_per_position_rotation_modality
    keys:
    - left_position
    - right_position
    - left_rotation
    - right_rotation
    - null
    actual_visible_valid_estimates_only: true
    filled_values_are_observations: false
    endpoint_features: 16
    joint_id_dim: 16
    endpoint_mlp:
    - 32
    - 64
    - 32
    attention_heads: 1
    null_value: fixed_zero
    apply_to: missing_or_occluded_joint_tokens
    output_projection_initialization: zeros
  readout:
    separate_ego_exo_weights: true
    final:
      channels_in: 256
      channels_out: 135
      temporal_kernel: 1
      prediction:
        ego: absolute_clean_kinematics
        exo: unbounded_reference_relative_kinematics_then_absolute_clean_decode
    coarse:
      channels_in: 1024
      channels_out: 135
      temporal_kernel: 1
      temporal_upsample: linear_32_to_128
      purpose: same_forward_scene_query
      query_detached: true
      final_prediction_bounded_by_coarse: false
      prediction: same_mode_parameterization_as_final
  removed:
    temporal_mixture_anchor: true
    adapted_minus_reference: true
    reliability_state_replacement: true
    output_repair_radius: true
    independent_raw_position_head: true
  reference_anchor:
    mode: exo
    filter: single_symmetric_triangular
    frames: 5
    kernel:
    - 1
    - 2
    - 3
    - 2
    - 1
    kernel_normalizer: 9
    modalities:
    - root_position
    - local_rotations
    normalization: per_modality_valid_confidence
    rotation_mean: project_weighted_matrix_mean_to_SO3
    global_positions: same_shape_fk_only
    interior_missing: linear_root_slerp_rotation
    prefix_suffix: nearest_valid_hold
    no_valid_endpoint: neutral_and_null
    filled_values_are_observations: false
    raw_estimate_also_encoded: true
    used_as: residual_readout_reference_not_radius
    gradient: false
scene:
  one_shared_parameter_instance: true
  enabled_in_stages:
  - C
  history_points: 8192
  current_points_per_frame: 512
  history_voxel_m: 0.05
  neighbours: 8
  query_radius_m: 0.6
  surface_anchors: 67
  body_regions: 22
  relation_dim: 12
  coarse_body_state_dim: 12
  region_id_dim: 8
  token_mlp:
  - 32
  - 64
  - 64
  frame_projection_dim: 128
  temporal_kernels:
  - 3
  - 3
  inject_at:
  - decoder_64
  - decoder_128
  projection_initialization: zeros
  noise_gate: sqrt_alpha_bar
  require_surface_or_measured_free_evidence: true
  final_zero_gate_for_unknown: true
  scene_dropout_probability: 0.2
  query_from: current_forward_coarse_kinematics
  full_backbone_forwards_per_diffusion_step: 1
  future_scene_input: false
  hidden_complete_mesh_input: false
  signed_closed_surface_sdf: false
  reuse_observed_neighbourhood_trees_within_window: true
diffusion:
  train_target: absolute_clean_motion
  timesteps: 1000
  schedule: cosine
  train_timestep_range:
    ego:
    - 0
    - 999
    exo:
    - 0
    - 999
  observed_motion_in_forward_clean_target: false
  inference_start: gaussian_noise
  ddim_steps:
    ego: 20
    exo: 20
  ddim_eta: 0.0
  classifier_free_guidance: false
loss:
  huber_delta: 1.0
  reduction_order:
  - per_sample
  - per_source
  - per_mode
  mode_weights:
    ego: 0.5
    exo: 0.5
  root:
    weight: 1.0
    position_scale_m: 0.1
  pose:
    weight: 1.0
    position_scale_m: 0.1
    root_relative: true
    exclude_root: true
  rotation:
    weight: 0.5
    metric: local_matrix_frobenius_squared_div_6
  velocity:
    weight: 0.1
    scale_m_per_s: 1.0
    signal_gate: alpha_bar
  observed:
    weight: 0.1
    signal_gate: alpha_bar
    position_scale_m: 0.02
    rotation_scale_rad: 0.1
    sensor_mapping: per_mode
    unobserved_estimates_preservation_loss: false
  shape:
    weight: 0.1
    ego_only: true
    rest_scale_m: 0.05
    beta_scale: train_standard_deviation
    inner_template_ce_weight: 0.1
  coarse:
    weight: 0.25
    components:
      root: 1.0
      pose: 1.0
      rotation: 0.5
    enabled_for_gradient_in_stages:
    - A
    - B
  exo_region_reduction:
    terms:
    - pose
    - rotation
    - velocity
    - acceleration
    visible_hidden_weights_when_both_present:
    - 0.5
    - 0.5
    single_present_group_weight: 1.0
  acceleration:
    weight: 0.05
    exo_only: true
    scale_m_per_s2: 2.0
    signal_gate: alpha_bar
    target: acceleration_error_against_ground_truth_not_zero_acceleration
    stencil_frames: 3
frontend:
  condition_probabilities:
    identity: 0.2
    tracking: 0.35
    occlusion: 0.25
    gap: 0.2
  beta_sigma: 0.15
  pose_sigma_rad:
  - 0.015
  - 0.04
  occluded_pose_sigma_rad:
  - 0.12
  - 0.25
  root_sigma_m:
  - 0.01
  - 0.04
  pose_ar: 0.85
  root_ar: 0.95
  total_gap_frames:
  - 8
  - 32
  placements:
  - prefix
  - interior
  - suffix
  multiple_gap_fraction_within_gap_condition: 0.5
  multiple_gap_count: 2
  each_multiple_gap_frames:
  - 4
  - 16
  valid_nonidentity_confidence_jitter_uniform:
  - -0.1
  - 0.1
  confidence_uses_actual_target_error: false
  gap_fill: linear_root_slerp_rotation_nearest_end_hold
  gap_fill_mask_remains_missing: true
  ego_observation_noise:
    clean_probability: 0.5
    noise_space: SE3_measurement_perturbation
    position_control_point_sigma_m:
    - 0.001
    - 0.005
    rotation_control_point_sigma_deg:
    - 0.1
    - 0.5
    control_point_spacing_seconds:
    - 0.2
    - 0.5
    interpolation: smooth_error_curve
    recompute_all_derived_features: true
    confidence_from_declared_noise_not_realized_error: true
    real_sensor_calibrated: false
    calibration_required_before_formal_training: true
    dropout_in_main_training: false
    correlated_camera_scene_error_requires_consistent_frame_contract: true
  temporal_noise_review:
    legacy_AR_retained_for_matched_pilot: true
    legacy_validation_not_made_easier: true
    real_frontend_temporal_distribution_validated: false
    calibration_required_before_formal_training: true
    candidate: low_frequency_drift_plus_small_high_frequency_jitter
    candidate_scales: pending_train_frontend_calibration
